; DreamDynamicWorld was called "DreamWind" until 2026-08-18, when it became the home for wind, water
; and weather; its content moved from /DreamWind/<X> to /DreamDynamicWorld/Wind/<X>. This redirect
; keeps levels and assets that still reference the old mount point loading. It costs nothing to keep,
; so leave it in unless you are certain nothing references /DreamWind any more.
;
; NOTE: package redirects are read before plugin configs are merged, so this file alone does NOT
; apply - copy the section into your project's Config/DefaultEngine.ini.


[CoreRedirects]
+PackageRedirects=(OldName="/DreamWind/...",NewName="/DreamDynamicWorld/Wind/...",MatchWildcard=true)
; The wind's own collection became the one collection every subsystem of the plugin shares.
+PackageRedirects=(OldName="/DreamDynamicWorld/Wind/MPC_DreamWind",NewName="/DreamDynamicWorld/MPC_DreamDynamicWorld")
+ObjectRedirects=(OldName="/DreamDynamicWorld/Wind/MPC_DreamWind.MPC_DreamWind",NewName="/DreamDynamicWorld/MPC_DreamDynamicWorld.MPC_DreamDynamicWorld")
