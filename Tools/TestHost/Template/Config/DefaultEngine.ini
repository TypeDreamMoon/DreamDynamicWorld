; DreamDynamicWorld test host -- engine config.
;
; The renderer and target-platform values are the DreamShader test host's, verbatim. Both hosts run on the
; same installed engine, and these values feed the shader cache keys, so agreeing on them lets this host
; read the shader derived data the other one has already warmed instead of compiling everything again.
;
; There is deliberately no derived-data-cache section: the cache actually used is the machine-wide local
; Zen store.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/DreamDynamicWorld/Sky/Maps/Lvl_DreamSkyTest.Lvl_DreamSkyTest
GameDefaultMap=/DreamDynamicWorld/Sky/Maps/Lvl_DreamSkyTest.Lvl_DreamSkyTest

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

[CoreRedirects]
; The plugin was called DreamWind until its content moved to /DreamDynamicWorld/Wind/. Package redirects
; are read before plugin configs merge, so the copy in the plugin's own Config does not apply on its own.
+PackageRedirects=(OldName="/DreamWind/...",NewName="/DreamDynamicWorld/Wind/...",MatchWildcard=true)
+PackageRedirects=(OldName="/DreamDynamicWorld/Wind/MPC_DreamWind",NewName="/DreamDynamicWorld/MPC_DreamDynamicWorld")
+ObjectRedirects=(OldName="/DreamDynamicWorld/Wind/MPC_DreamWind.MPC_DreamWind",NewName="/DreamDynamicWorld/MPC_DreamDynamicWorld.MPC_DreamDynamicWorld")
